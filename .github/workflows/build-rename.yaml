name: build-rename

on:
  workflow_dispatch:
    inputs:
      frontend_variant:
        description: "Frontend variant to rename"
        required: true
        type: choice
        options:
          - cloud
          - cloud_v2
          - standard
          - standard_v2
        default: standard_v2

      namespace:
        description: "SAP namespace, e.g. #SCT# or #SCT#AU5"
        required: true
        type: string
        default: "#SCT#AU5"

permissions:
  contents: read

concurrency:
  group: build_rename-${{ inputs.frontend_variant }}-${{ inputs.namespace }}
  cancel-in-progress: false

jobs:
  build_rename:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    env:
      FRONTEND_VARIANT: ${{ inputs.frontend_variant }}
      NAMESPACE: ${{ inputs.namespace }}

    steps:
      # ---------------------------------------------------------------
      # Derive the namespace representations used in the frontend output.
      #
      # Example input:
      #   #SCT#AU5
      #
      # Results:
      #   TECH_NAMESPACE = sct_au5
      #   SAP_NAMESPACE  = /sct/au5
      #   GIT_NAMESPACE  = #sct#au5
      #   CLEAN_NAMESPACE = sctau5
      #   BRANCH         = rename_standard_v2_sct_au5
      # ---------------------------------------------------------------
      - name: Derive namespace and branch name
        shell: bash
        run: |
          set -euo pipefail

          raw="$NAMESPACE"
          raw="$(printf '%s' "$raw" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          first=""
          second=""

          # Format: #SCT#
          if [[ "$raw" =~ ^#([A-Za-z][A-Za-z0-9_]*)#$ ]]; then
            first="${BASH_REMATCH[1]}"

          # Format: #SCT#AU5
          elif [[ "$raw" =~ ^#([A-Za-z][A-Za-z0-9_]*)#([A-Za-z][A-Za-z0-9_]*)$ ]]; then
            first="${BASH_REMATCH[1]}"
            second="${BASH_REMATCH[2]}"

          # Format: SCT
          elif [[ "$raw" =~ ^([A-Za-z][A-Za-z0-9_]*)$ ]]; then
            first="${BASH_REMATCH[1]}"

          # Format: SCT_AU5
          elif [[ "$raw" =~ ^([A-Za-z][A-Za-z0-9_]*)_([A-Za-z][A-Za-z0-9_]*)$ ]]; then
            first="${BASH_REMATCH[1]}"
            second="${BASH_REMATCH[2]}"

          # Format: /SCT/AU5
          elif [[ "$raw" =~ ^/([A-Za-z][A-Za-z0-9_]*)/([A-Za-z][A-Za-z0-9_]*)$ ]]; then
            first="${BASH_REMATCH[1]}"
            second="${BASH_REMATCH[2]}"

          else
            echo "::error::Invalid namespace '$NAMESPACE'."
            echo "::error::Use #SCT#, #SCT#AU5, SCT, SCT_AU5 or /SCT/AU5."
            exit 1
          fi

          first_lower="$(printf '%s' "$first" | tr '[:upper:]' '[:lower:]')"
          second_lower="$(printf '%s' "$second" | tr '[:upper:]' '[:lower:]')"

          if ! printf '%s' "$first_lower" | grep -Eq '^[a-z][a-z0-9_]{0,9}$'; then
            echo "::error::Invalid first namespace component '$first'."
            exit 1
          fi

          if [ -n "$second_lower" ] &&
             ! printf '%s' "$second_lower" | grep -Eq '^[a-z][a-z0-9_]{0,9}$'; then
            echo "::error::Invalid second namespace component '$second'."
            exit 1
          fi

          if [ -n "$second_lower" ]; then
            tech_namespace="${first_lower}_${second_lower}"
            sap_namespace="/${first_lower}/${second_lower}"
            git_namespace="#${first_lower}#${second_lower}"
            clean_namespace="${first_lower}${second_lower}"
            branch_name="rename_${FRONTEND_VARIANT}_${first_lower}_${second_lower}"
            tech_prefix="${tech_namespace}_"
            sap_prefix="${sap_namespace}_"
            git_prefix="${git_namespace}_"
          else
            tech_namespace="${first_lower}"
            sap_namespace="/${first_lower}/"
            git_namespace="#${first_lower}"
            clean_namespace="${first_lower}"
            branch_name="rename_${FRONTEND_VARIANT}_${first_lower}"
            tech_prefix="${tech_namespace}_"
            sap_prefix="${sap_namespace}"
            git_prefix="${git_namespace}"
          fi

          if [ "${#tech_namespace}" -gt 10 ]; then
            echo "::error::Namespace '$NAMESPACE' is too long."
            echo "::error::Technical namespace '$tech_namespace' exceeds 10 characters."
            exit 1
          fi

          if [ "$tech_namespace" = "z2ui5" ]; then
            echo "::error::Namespace '$NAMESPACE' is the original namespace - nothing to rename."
            exit 1
          fi

          if [ "$FRONTEND_VARIANT" != "cloud" ] &&
             [ "$FRONTEND_VARIANT" != "cloud_v2" ] &&
             [ "$FRONTEND_VARIANT" != "standard" ] &&
             [ "$FRONTEND_VARIANT" != "standard_v2" ]; then
            echo "::error::Invalid frontend variant '$FRONTEND_VARIANT'."
            exit 1
          fi

          echo "TECH_NAMESPACE=$tech_namespace" >> "$GITHUB_ENV"
          echo "SAP_NAMESPACE=$sap_namespace" >> "$GITHUB_ENV"
          echo "GIT_NAMESPACE=$git_namespace" >> "$GITHUB_ENV"
          echo "CLEAN_NAMESPACE=$clean_namespace" >> "$GITHUB_ENV"
          echo "TECH_PREFIX=$tech_prefix" >> "$GITHUB_ENV"
          echo "SAP_PREFIX=$sap_prefix" >> "$GITHUB_ENV"
          echo "GIT_PREFIX=$git_prefix" >> "$GITHUB_ENV"
          echo "BRANCH=$branch_name" >> "$GITHUB_ENV"

          echo "Input namespace:       $NAMESPACE"
          echo "Technical namespace:   $tech_namespace"
          echo "ABAP code namespace:   $sap_namespace"
          echo "Git filename namespace: $git_namespace"
          echo "Clean namespace:       $clean_namespace"
          echo "Variant:               $FRONTEND_VARIANT"
          echo "Branch:                $branch_name"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------------
      # Make sure the selected frontend variant exists.
      # ---------------------------------------------------------------
      - name: Validate variant directory
        shell: bash
        run: |
          set -euo pipefail

          variant_dir="result/$FRONTEND_VARIANT"
          if [ ! -d "$variant_dir" ]; then
            echo "::error::Frontend variant '$FRONTEND_VARIANT' does not exist under result/."
            exit 1
          fi

          echo "Target directory: $variant_dir"

      # ---------------------------------------------------------------
      # Rename everything in the selected frontend result tree.
      #
      # Important split:
      #   - ABAP objects and ABAP references in src/ stay in SAP/abapGit style
      #     like #sct#au5 or /sct/au5
      #   - UI5/JavaScript/SICF/frontend references become clean names like
      #     sctau5 without #, / or _
      # ---------------------------------------------------------------
      - name: Rename frontend namespace in generated files
        shell: bash
        run: |
          set -euo pipefail

          export CLEAN_NAMESPACE
          export TECH_NAMESPACE
          export SAP_NAMESPACE
          export GIT_NAMESPACE

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          clean_namespace = os.environ["CLEAN_NAMESPACE"]
          tech_namespace = os.environ["TECH_NAMESPACE"]
          sap_namespace = os.environ["SAP_NAMESPACE"]
          git_namespace = os.environ["GIT_NAMESPACE"]

          base = Path("result") / os.environ["FRONTEND_VARIANT"]
          if not base.exists():
              raise SystemExit(f"Missing variant directory: {base}")

          def is_abap_object(path: Path) -> bool:
              name = path.name.lower()
              if name.endswith(".clas.abap") or name.endswith(".intf.abap"):
                  return True
              if name.endswith(".clas.xml") or name.endswith(".intf.xml"):
                  return True
              if name.endswith(".devc.xml") or name.endswith(".http.xml") or name.endswith(".sco2.xml") or name.endswith(".sia1.xml") or name.endswith(".sia7.xml"):
                  return True
              if "package.devc.xml" in name:
                  return True
              if "z2ui5_cl_" in name or "z2ui5_if_" in name:
                  return True
              return False

          def is_frontend_asset(path: Path) -> bool:
              rel = path.relative_to(base).as_posix().lower()
              if "/app/" in rel or "/webapp/" in rel:
                  return True
              name = path.name.lower()
              if name.endswith(".sicf.xml") or name.endswith(".sia6.xml"):
                  return True
              if "wapa" in name or ".cc_" in name or ".controller_" in name or ".core_" in name or ".devtools_" in name or ".model_" in name or ".view_" in name:
                  return True
              if name.endswith(".js") or name.endswith(".css") or name.endswith(".html") or name.endswith(".json") or name.endswith(".xml"):
                  if "wapa" in name or "controller_" in name or "core_" in name or "devtools_" in name or "model_" in name or "view_" in name:
                      return True
              return False

          # First pass: rename file names
          for path in sorted(base.rglob("*"), key=lambda p: (len(p.parts), str(p)), reverse=True):
              if not path.is_file():
                  continue

              name = path.name
              if is_frontend_asset(path):
                  new_name = name.replace("z2ui5", clean_namespace)
                  new_name = new_name.replace("Z2UI5", clean_namespace.upper())
                  if new_name != name:
                      path.rename(path.with_name(new_name))
              elif is_abap_object(path):
                  new_name = name.replace("z2ui5", git_namespace)
                  new_name = new_name.replace("Z2UI5", git_namespace.upper())
                  if new_name != name:
                      path.rename(path.with_name(new_name))

          # Second pass: replace namespace references in file contents
          for path in sorted(base.rglob("*"), key=lambda p: (len(p.parts), str(p)), reverse=True):
              if not path.is_file():
                  continue

              try:
                  data = path.read_bytes()
              except OSError:
                  continue

              if b"\x00" in data:
                  continue

              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue

              original = text

              if path.name.lower().endswith(".sicf.xml"):
                  # SICF is hybrid:
                  # - URLs and service names become clean names without # or /
                  # - ABAP handler references remain SAP notation
                  text = text.replace("z2ui5", clean_namespace)
                  text = text.replace("Z2UI5", clean_namespace.upper())
                  text = text.replace("z2ui5_", f"{clean_namespace}_")
                  text = text.replace("Z2UI5_", f"{clean_namespace.upper()}_")

                  # Replace SICF URL and service id values
                  text = text.replace("#sct#au5", clean_namespace)
                  text = text.replace("#SCT#AU5", clean_namespace.upper())
                  text = text.replace("/sct/au5", f"/{clean_namespace}")
                  text = text.replace("/SCT/AU5", f"/{clean_namespace.upper()}")

                  # Keep ABAP handler as SAP notation
                  text = text.replace(f"#{clean_namespace.upper()}_CL_LP_HANDLER", f"/{clean_namespace.upper()}_CL_LP_HANDLER")
                  text = text.replace(f"#{clean_namespace.upper()}_CL_", f"/{clean_namespace.upper()}_CL_")
                  text = text.replace(f"#{clean_namespace.upper()}_IF_", f"/{clean_namespace.upper()}_IF_")

                  # Generic ABAP handler conversion if old z2ui5 is used
                  text = text.replace("#z2ui5", f"#{clean_namespace}")
                  text = text.replace("#Z2UI5", f"#{clean_namespace.upper()}")
                  text = text.replace("/z2ui5/", f"/{clean_namespace}/")
                  text = text.replace("/Z2UI5/", f"/{clean_namespace.upper()}/")

                  # Explicit ABAP class conversion in SICF:
                  # #SCT#AU5_CL_LP_HANDLER -> /SCT/AU5_CL_LP_HANDLER
                  text = text.replace("#SCT#AU5_CL_LP_HANDLER", "/SCT/AU5_CL_LP_HANDLER")
                  text = text.replace("#sct#au5_cl_lp_handler", "/sct/au5_cl_lp_handler")
                  text = text.replace("#SCT#AU5_CL_", "/SCT/AU5_CL_")
                  text = text.replace("#sct#au5_cl_", "/sct/au5_cl_")

                  # Also catch any generic ABAP class references in SICF
                  text = text.replace("#Z2UI5_CL_", "/Z2UI5_CL_")
                  text = text.replace("#z2ui5_cl_", "/z2ui5_cl_")

              elif is_frontend_asset(path):
                  # Frontend namespace: use clean names without # / / _
                  text = text.replace("z2ui5", clean_namespace)
                  text = text.replace("Z2UI5", clean_namespace.upper())
                  text = text.replace("z2ui5_", f"{clean_namespace}_")
                  text = text.replace("Z2UI5_", f"{clean_namespace.upper()}_")
                  text = text.replace("z2ui5.", f"{clean_namespace}.")
                  text = text.replace("Z2UI5.", f"{clean_namespace.upper()}.")
                  text = text.replace("z2ui5/", f"{clean_namespace}/")
                  text = text.replace("Z2UI5/", f"{clean_namespace.upper()}/")

              elif is_abap_object(path):
                  # ABAP object namespace: use SAP / abapGit style
                  # IMPORTANT:
                  #   - file names get #sct#au5
                  #   - code content gets /sct/au5
                  text = text.replace("z2ui5", sap_namespace.lower())
                  text = text.replace("Z2UI5", sap_namespace.upper())
                  text = text.replace("z2ui5_", f"{sap_namespace.lower()}_")
                  text = text.replace("Z2UI5_", f"{sap_namespace.upper()}_")
                  text = text.replace("/z2ui5/", f"{sap_namespace}")
                  text = text.replace("/Z2UI5/", f"{sap_namespace.upper()}")
                  text = text.replace("#z2ui5", f"{git_namespace}")
                  text = text.replace("#Z2UI5", f"{git_namespace.upper()}")
                  text = text.replace("#z2ui5_", f"{git_namespace}_")
                  text = text.replace("#Z2UI5_", f"{git_namespace.upper()}_")

              if text != original:
                  path.write_text(text, encoding="utf-8")
          PY

      # ---------------------------------------------------------------
      # Final safety check: warn if z2ui5 is still left anywhere.
      # No fail, just warning.
      # ---------------------------------------------------------------
      - name: Warn about any remaining z2ui5 references
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          variant_dir = Path("result") / os.environ["FRONTEND_VARIANT"]
          matches = []

          for path in sorted(variant_dir.rglob("*"), key=lambda p: (len(p.parts), str(p)), reverse=True):
              if not path.is_file():
                  continue
              try:
                  data = path.read_bytes()
              except OSError:
                  continue
              if b"\x00" in data:
                  continue
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              count = len(re.findall(r"(?i)z2ui5", text))
              if count:
                  matches.append((str(path), count))

          if matches:
              print("::warning::Found remaining z2ui5 references in the renamed frontend tree. Continuing anyway.")
              for file_path, count in matches[:25]:
                  print(f"::warning::  {file_path}: {count} occurrence(s)")
              if len(matches) > 25:
                  print(f"::warning::  ... and {len(matches) - 25} more file(s)")
          else:
              print("::notice::No z2ui5 references remain in the renamed frontend tree.")
          PY

      # ---------------------------------------------------------------
      # Assemble branch content from the chosen result version only.
      # ---------------------------------------------------------------
      - name: Assemble renamed branch
        shell: bash
        run: |
          set -euo pipefail

          src_dir="result/$FRONTEND_VARIANT"
          out=".github/out/$BRANCH"

          rm -rf "$out"
          mkdir -p "$out"

          cp -R "$src_dir"/. "$out/"

      # ---------------------------------------------------------------
      # Push a branch with the renamed result tree.
      # ---------------------------------------------------------------
      - name: Push renamed branch
        shell: bash
        run: |
          set -euo pipefail

          b="$BRANCH"

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git fetch origin "$b" --depth 1 2>/dev/null || true

          parent="$(git rev-parse -q --verify "refs/remotes/origin/$b" || true)"

          index="$RUNNER_TEMP/index-$b"
          rm -f "$index"

          (
            cd ".github/out/$b"

            export GIT_DIR="$GITHUB_WORKSPACE/.git"
            export GIT_WORK_TREE=.
            export GIT_INDEX_FILE="$index"

            git add -A
          )

          tree="$(GIT_INDEX_FILE="$index" git write-tree)"

          if [ -n "$parent" ] &&
             [ "$(git rev-parse "$parent^{tree}")" = "$tree" ]; then
            echo "$b: no changes"
            exit 0
          fi

          if [ -n "$parent" ]; then
            commit="$(
              git commit-tree \
                "$tree" \
                -p "$parent" \
                -p "$GITHUB_SHA" \
                -m "build: $b from $GITHUB_SHA"
            )"
          else
            commit="$(
              git commit-tree \
                "$tree" \
                -p "$GITHUB_SHA" \
                -m "build: $b from $GITHUB_SHA"
            )"
          fi

          git push origin "$commit:refs/heads/$b"

          echo "$b: pushed $commit"
