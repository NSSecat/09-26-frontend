name: frontend-rename

on:
  workflow_dispatch:
    inputs:
      frontend_variant:
        description: "Frontend variant to rename"
        required: true
        type: choice
        options:
          - cloud
          - cloud_v2
          - standard
          - standard_v2
        default: standard_v2

      namespace:
        description: "SAP namespace, e.g. #SCT# or #SCT#AU5"
        required: true
        type: string
        default: "#SCT#AU5"

permissions:
  contents: read

concurrency:
  group: build_rename-${{ inputs.frontend_variant }}-${{ inputs.namespace }}
  cancel-in-progress: false

jobs:
  build_rename:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    env:
      FRONTEND_VARIANT: ${{ inputs.frontend_variant }}
      NAMESPACE: ${{ inputs.namespace }}

    steps:
      - name: Derive namespace and branch name
        shell: bash
        run: |
          set -euo pipefail

          raw="$NAMESPACE"
          raw="$(printf '%s' "$raw" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          first=""
          second=""

          # Format: #SCT#
          if [[ "$raw" =~ ^#([A-Za-z][A-Za-z0-9_]*)#$ ]]; then
            first="${BASH_REMATCH[1]}"

          # Format: #SCT#AU5
          elif [[ "$raw" =~ ^#([A-Za-z][A-Za-z0-9_]*)#([A-Za-z][A-Za-z0-9_]*)$ ]]; then
            first="${BASH_REMATCH[1]}"
            second="${BASH_REMATCH[2]}"

          # Format: SCT
          elif [[ "$raw" =~ ^([A-Za-z][A-Za-z0-9_]*)$ ]]; then
            first="${BASH_REMATCH[1]}"

          # Format: SCT_AU5
          elif [[ "$raw" =~ ^([A-Za-z][A-Za-z0-9_]*)_([A-Za-z][A-Za-z0-9_]*)$ ]]; then
            first="${BASH_REMATCH[1]}"
            second="${BASH_REMATCH[2]}"

          # Format: /SCT/AU5
          elif [[ "$raw" =~ ^/([A-Za-z][A-Za-z0-9_]*)/([A-Za-z][A-Za-z0-9_]*)$ ]]; then
            first="${BASH_REMATCH[1]}"
            second="${BASH_REMATCH[2]}"

          else
            echo "::error::Invalid namespace '$NAMESPACE'."
            echo "::error::Use #SCT#, #SCT#AU5, SCT, SCT_AU5 or /SCT/AU5."
            exit 1
          fi

          first_lower="$(printf '%s' "$first" | tr '[:upper:]' '[:lower:]')"
          second_lower="$(printf '%s' "$second" | tr '[:upper:]' '[:lower:]')"

          if ! printf '%s' "$first_lower" | grep -Eq '^[a-z][a-z0-9_]{0,9}$'; then
            echo "::error::Invalid first namespace component '$first'."
            exit 1
          fi

          if [ -n "$second_lower" ] &&
             ! printf '%s' "$second_lower" | grep -Eq '^[a-z][a-z0-9_]{0,9}$'; then
            echo "::error::Invalid second namespace component '$second'."
            exit 1
          fi

          if [ -n "$second_lower" ]; then
            tech_namespace="${first_lower}_${second_lower}"
            sap_namespace="/${first_lower}/${second_lower}"
            git_namespace="#${first_lower}#${second_lower}"
            clean_namespace="${first_lower}${second_lower}"
            flp_namespace="${second_lower}_flp"
            branch_name="rename_${FRONTEND_VARIANT}_${first_lower}_${second_lower}"
            tech_prefix="${tech_namespace}_"
            sap_prefix="${sap_namespace}_"
            git_prefix="${git_namespace}_"
          else
            tech_namespace="${first_lower}"
            sap_namespace="/${first_lower}/"
            git_namespace="#${first_lower}"
            clean_namespace="${first_lower}"
            flp_namespace="flp"
            branch_name="rename_${FRONTEND_VARIANT}_${first_lower}"
            tech_prefix="${tech_namespace}_"
            sap_prefix="${sap_namespace}"
            git_prefix="${git_namespace}"
          fi

          if [ "${#tech_namespace}" -gt 10 ]; then
            echo "::error::Namespace '$NAMESPACE' is too long."
            echo "::error::Technical namespace '$tech_namespace' exceeds 10 characters."
            exit 1
          fi

          echo "TECH_NAMESPACE=$tech_namespace" >> "$GITHUB_ENV"
          echo "SAP_NAMESPACE=$sap_namespace" >> "$GITHUB_ENV"
          echo "GIT_NAMESPACE=$git_namespace" >> "$GITHUB_ENV"
          echo "CLEAN_NAMESPACE=$clean_namespace" >> "$GITHUB_ENV"
          echo "FLP_NAMESPACE=$flp_namespace" >> "$GITHUB_ENV"
          echo "TECH_PREFIX=$tech_prefix" >> "$GITHUB_ENV"
          echo "SAP_PREFIX=$sap_prefix" >> "$GITHUB_ENV"
          echo "GIT_PREFIX=$git_prefix" >> "$GITHUB_ENV"
          echo "BRANCH=$branch_name" >> "$GITHUB_ENV"

          echo "Input namespace:       $NAMESPACE"
          echo "Technical namespace:   $tech_namespace"
          echo "ABAP code namespace:   $sap_namespace"
          echo "Git filename namespace: $git_namespace"
          echo "Clean namespace:       $clean_namespace"
          echo "FLP namespace:         $flp_namespace"
          echo "Variant:               $FRONTEND_VARIANT"
          echo "Branch:                $branch_name"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate variant directory
        shell: bash
        run: |
          set -euo pipefail

          variant_dir="result/$FRONTEND_VARIANT"
          if [ ! -d "$variant_dir" ]; then
            echo "::error::Frontend variant '$FRONTEND_VARIANT' does not exist under result/."
            exit 1
          fi

          echo "Target directory: $variant_dir"

      - name: Rename frontend namespace in generated files
        shell: bash
        run: |
          set -euo pipefail

          export CLEAN_NAMESPACE
          export FLP_NAMESPACE
          export GIT_NAMESPACE

          python3 <<'PY'
          import os
          from pathlib import Path

          clean_namespace = os.environ["CLEAN_NAMESPACE"]
          flp_namespace = os.environ["FLP_NAMESPACE"]
          git_namespace = os.environ["GIT_NAMESPACE"]

          base = Path("result") / os.environ["FRONTEND_VARIANT"]
          if not base.exists():
              raise SystemExit(f"Missing variant directory: {base}")

          # First pass: rename file names
          for path in sorted(base.rglob("*"), key=lambda p: (len(p.parts), str(p)), reverse=True):
              if not path.is_file():
                  continue

              rel = path.relative_to(base)
              parts = rel.parts
              name = path.name
              lower_name = name.lower()

              is_src_01 = len(parts) >= 2 and parts[0] == "src" and parts[1] == "01"
              is_src_02 = len(parts) >= 2 and parts[0] == "src" and parts[1] == "02"
              is_sicf = lower_name.endswith(".sicf.xml")
              is_package_devc = lower_name.endswith("package.devc.xml")

              if is_src_01 and is_sicf:
                  # src/01 SICF filename is fixed to #sct#au5_handler
                  new_name = name.replace("z2ui5", "#sct#au5_handler")
                  new_name = new_name.replace("Z2UI5", "#SCT#AU5_HANDLER")

              elif is_src_02 and not is_package_devc:
                  # src/02 all files except package.devc.xml -> hardcoded
                  new_name = name.replace("z2ui5", "#sct#au5_flp")
                  new_name = new_name.replace("Z2UI5", "#SCT#AU5_FLP")

              else:
                  # Default file naming
                  new_name = name.replace("z2ui5", git_namespace)
                  new_name = new_name.replace("Z2UI5", git_namespace.upper())

              if new_name != name:
                  path.rename(path.with_name(new_name))

          # Second pass: replace namespace refs
          for path in sorted(base.rglob("*"), key=lambda p: (len(p.parts), str(p)), reverse=True):
              if not path.is_file():
                  continue

              try:
                  data = path.read_bytes()
              except OSError:
                  continue

              if b"\x00" in data:
                  continue

              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue

              original = text
              rel = path.relative_to(base)
              parts = rel.parts

              is_src_01 = len(parts) >= 2 and parts[0] == "src" and parts[1] == "01"
              is_src_02 = len(parts) >= 2 and parts[0] == "src" and parts[1] == "02"
              is_sicf = path.name.lower().endswith(".sicf.xml")
              is_package_devc = path.name.lower().endswith("package.devc.xml")

              if is_src_01:
                  lower_name = path.name.lower()
                  is_abap_object = (
                      lower_name.endswith(".clas.abap")
                      or lower_name.endswith(".intf.abap")
                      or lower_name.endswith(".clas.xml")
                      or lower_name.endswith(".intf.xml")
                      or lower_name.endswith(".devc.xml")
                  )

                  if is_abap_object:
                      # ABAP object references remain SAP notation
                      text = text.replace("z2ui5", "/sct/au5")
                      text = text.replace("Z2UI5", "/SCT/AU5")
                      text = text.replace("z2ui5_", "/sct/au5_")
                      text = text.replace("Z2UI5_", "/SCT/AU5_")
                  elif is_sicf:
                      # src/01 SICF hardcoded for AU5_HANDLER
                      text = text.replace("z2ui5", "au5_handler")
                      text = text.replace("Z2UI5", "AU5_HANDLER")
                      text = text.replace("/sap/bc/sctau5/", "/sap/bc/sct/au5_handler/")
                      text = text.replace("/SAP/BC/SCTAUA5/", "/SAP/BC/SCT/AU5_HANDLER/")
                      text = text.replace("/sap/bc/sct/sctau5/", "/sap/bc/sct/au5_handler/")
                      text = text.replace("/SAP/BC/SCT/SCTAUA5/", "/SAP/BC/SCT/AU5_HANDLER/")
                      text = text.replace("ICF_NAME>AU5_HANDLER</ICF_NAME>", "ICF_NAME>AU5_HANDLER</ICF_NAME>")
                      text = text.replace("ORIG_NAME>au5_handler</ORIG_NAME>", "ORIG_NAME>au5_handler</ORIG_NAME>")
                      text = text.replace("ICFHANDLER>/SCT/AU5_CL_LP_HANDLER</ICFHANDLER>", "ICFHANDLER>/SCT/AU5_CL_LP_HANDLER</ICFHANDLER>")
                  else:
                      text = text.replace("z2ui5", clean_namespace)
                      text = text.replace("Z2UI5", clean_namespace.upper())
                      text = text.replace("z2ui5_", f"{clean_namespace}_")
                      text = text.replace("Z2UI5_", f"{clean_namespace.upper()}_")

              elif is_src_02:
                  if is_sicf:
                      # src/02 SICF hardcoded values
                      text = text.replace("z2ui5", "au5_flp")
                      text = text.replace("Z2UI5", "AU5_FLP")
                      text = text.replace("/sap/bc/ui5_ui5/sap/au5_flp/", "/sap/bc/ui5_ui5/sap/sct/au5_flp/")
                      text = text.replace("/sap/bc/bsp/sap/au5_flp/", "/sap/bc/bsp/sap/sct/au5_flp/")
                      text = text.replace("/sap/bc/ui5_ui5/sap/sct/au5_flp/", "/sap/bc/ui5_ui5/sap/sct/au5_flp/")
                      text = text.replace("/sap/bc/bsp/sap/sct/au5_flp/", "/sap/bc/bsp/sap/sct/au5_flp/")
                  elif not is_package_devc:
                      text = text.replace("z2ui5", clean_namespace)
                      text = text.replace("Z2UI5", clean_namespace.upper())
                      text = text.replace("z2ui5_", f"{clean_namespace}_")
                      text = text.replace("Z2UI5_", f"{clean_namespace.upper()}_")
                  else:
                      pass

              else:
                  text = text.replace("z2ui5", clean_namespace)
                  text = text.replace("Z2UI5", clean_namespace.upper())
                  text = text.replace("z2ui5_", f"{clean_namespace}_")
                  text = text.replace("Z2UI5_", f"{clean_namespace.upper()}_")

              if text != original:
                  path.write_text(text, encoding="utf-8")
          PY

      - name: Warn about any remaining z2ui5 references
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          variant_dir = Path("result") / os.environ["FRONTEND_VARIANT"]
          matches = []

          for path in sorted(variant_dir.rglob("*"), key=lambda p: (len(p.parts), str(p)), reverse=True):
              if not path.is_file():
                  continue
              try:
                  data = path.read_bytes()
              except OSError:
                  continue
              if b"\x00" in data:
                  continue
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              count = len(re.findall(r"(?i)z2ui5", text))
              if count:
                  matches.append((str(path), count))

          if matches:
              print("::warning::Found remaining z2ui5 references in the renamed frontend tree. Continuing anyway.")
              for file_path, count in matches[:25]:
                  print(f"::warning::  {file_path}: {count} occurrence(s)")
              if len(matches) > 25:
                  print(f"::warning::  ... and {len(matches) - 25} more file(s)")
          else:
              print("::notice::No z2ui5 references remain in the renamed frontend tree.")
          PY

      - name: Assemble renamed branch
        shell: bash
        run: |
          set -euo pipefail

          src_dir="result/$FRONTEND_VARIANT"
          out=".github/out/$BRANCH"

          rm -rf "$out"
          mkdir -p "$out"

          cp -R "$src_dir"/. "$out/"

      - name: Push renamed branch
        shell: bash
        run: |
          set -euo pipefail

          b="$BRANCH"

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git fetch origin "$b" --depth 1 2>/dev/null || true

          parent="$(git rev-parse -q --verify "refs/remotes/origin/$b" || true)"

          index="$RUNNER_TEMP/index-$b"
          rm -f "$index"

          (
            cd ".github/out/$b"

            export GIT_DIR="$GITHUB_WORKSPACE/.git"
            export GIT_WORK_TREE=.
            export GIT_INDEX_FILE="$index"

            git add -A
          )

          tree="$(GIT_INDEX_FILE="$index" git write-tree)"

          if [ -n "$parent" ] &&
             [ "$(git rev-parse "$parent^{tree}")" = "$tree" ]; then
            echo "$b: no changes"
            exit 0
          fi

          if [ -n "$parent" ]; then
            commit="$(
              git commit-tree \
                "$tree" \
                -p "$parent" \
                -p "$GITHUB_SHA" \
                -m "build: $b from $GITHUB_SHA"
            )"
          else
            commit="$(
              git commit-tree \
                "$tree" \
                -p "$GITHUB_SHA" \
                -m "build: $b from $GITHUB_SHA"
            )"
          fi

          git push origin "$commit:refs/heads/$b"

          echo "$b: pushed $commit"
